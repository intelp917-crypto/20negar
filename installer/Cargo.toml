[package]
name = "negarsetup"
version = "1.0.0"
edition = "2021"
description = "Zero-dependency Windows setup wizard for the 20negar video management system"
publish = false

[[bin]]
name = "setup"
path = "src/main.rs"

# No external crates: the wizard orchestrates built-in Windows tooling
# (winget, curl, msiexec, rustup-init, npm, cargo) so it builds in seconds.
[dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
